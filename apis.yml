name: Breathe Well-being
description: 'Breathe Well-being is an India-based digital therapeutics and chronic-care company focused
  on Type 2 diabetes reversal and management. Through a mobile app (Android/iOS) it pairs continuous
  health coaching, personalized nutrition and lifestyle plans, medical supervision, and progress tracking
  to help members reduce blood sugar, lose weight, and lower medication dependence. Founded by Aditya
  Kaicker and Rohan Verma, the company is backed by Accel and Y Combinator (Series A, 2021). It operates
  as a direct-to-consumer health program rather than an API provider: as of this enrichment pass it
  publishes no public developer portal, API documentation, OpenAPI specification, SDKs, or /.well-known
  discovery surface (paths return the SPA lander fallback). This profile captures the company identity
  and its probed domain-security posture.'
